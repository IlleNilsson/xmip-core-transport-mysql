[package]
name = "xmip-core-transport-mysql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-mysql"
description = "MySQL transport: one row of a query is one Stream, a send is one INSERT; xmip-core-library-mariadb's protocol with MySQL's caching_sha2_password, full authentication over the estate's TLS or the server's RSA key. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md); with its TLS under the default feature, for the
# one reading of `tls` and `tls_name` (`transport::sql::client_tls`). Its
# declaration takes what every SQL Location declares (`transport::sql`),
# which needs no TLS.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# The protocol MySQL shares with MariaDB, both halves, and the native
# password a server may still switch an account to.
mariadb = { package = "xmip-core-library-mariadb", git = "https://github.com/IlleNilsson/xmip-core-library-mariadb", branch = "main", optional = true }
# SQL: the dialect MySQL reads as MariaDB writes it — its literals, its
# binary form, the INSERT a send writes — in the mode the session reads.
sql = { package = "xmip-core-library-sql", git = "https://github.com/IlleNilsson/xmip-core-library-sql", branch = "main", optional = true }
# The operating system's random source, which OAEP's seed is drawn from.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }
# caching_sha2_password: the estate's SHA-256 for the scramble
# (codec::digest), and RSA-OAEP for the password sent to a server's public
# key outside TLS. MySQL pads with OAEP over SHA-1, so sha1 is here as the
# digest type rsa's OAEP takes, of the digest generation rsa 0.9 is built
# on; it hashes nothing else.
rsa = { version = "0.9", optional = true }
sha1 = { version = "0.10", optional = true }
# What a login checks the server by under TLS (`tls::ClientSettings`), and
# the trust store the guarded login's test checks a certificate in.
tls = { package = "xmip-core-library-tls", git = "https://github.com/IlleNilsson/xmip-core-library-tls", branch = "main", optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = [
    "declaration",
    "transport/tls",
    "dep:mariadb",
    "dep:sql",
    "dep:codec",
    "dep:rsa",
    "dep:sha1",
    "dep:tls",
]
# The declaration alone.
declaration = []

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }
# A self-signed certificate for the guarded login's test. Test-only.
rcgen = "0.14"

[lints]
workspace = true
